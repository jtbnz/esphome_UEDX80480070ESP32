; PlatformIO Project Configuration File for Standalone VIEWE Display Driver
; Compatible with Flutter applications via serial/WiFi communication

[platformio]
default_envs = viewe_display_standalone

[env:viewe_display_standalone]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf

; Board configuration
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions_16MB.csv

; Build flags
build_flags =
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_SUPPORT=1
    -DCONFIG_SPIRAM_USE_MALLOC=1

; ESP-IDF specific configuration
board_build.esp-idf.sdkconfig_path = sdkconfig.defaults

; Monitor configuration
monitor_speed = 115200
monitor_filters = 
    esp32_exception_decoder
    colorize

; Upload configuration
upload_speed = 921600

; Dependencies for standalone operation
lib_deps =
    ArduinoJson@^6.21.0
